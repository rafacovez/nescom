{% load wagtailcore_tags wagtailsettings_tags %}
{% get_settings %}

{% with current_url=request.build_absolute_uri post_title=page.title %}
<div class="flex flex-wrap items-center gap-3">
  
  {% if cta_text %}
    <span class="text-xs font-bold text-base-content/70 uppercase tracking-wider">{{ cta_text }}</span>
  {% endif %}

  <div class="flex items-center gap-1 bg-base-100/90 backdrop-blur-md border border-base-200 p-1.5 rounded-2xl shadow-sm">
    
    <a href="https://api.whatsapp.com/send?text={{ post_title|urlencode }}%20-%20{{ current_url|urlencode }}" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn btn-ghost btn-circle btn-sm hover:text-success transition-colors" 
       title="Compartir en WhatsApp">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
    </a>
    
    <a href="https://twitter.com/intent/tweet?text={{ post_title|urlencode }}&url={{ current_url|urlencode }}{% if settings.home.ConfiguracionSitio.twitter_handle %}&via={{ settings.home.ConfiguracionSitio.twitter_handle }}{% endif %}" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn btn-ghost btn-circle btn-sm hover:text-primary transition-colors" 
       title="Compartir en X">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>
    
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ current_url|urlencode }}" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn btn-ghost btn-circle btn-sm hover:text-info transition-colors" 
       title="Compartir en Facebook">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.37 14.5 5 15.5 5H18V0h-3.808C10.59 0 9 1.588 9 4.7V8z"/></svg>
    </a>
    
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ current_url|urlencode }}" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn btn-ghost btn-circle btn-sm hover:text-info transition-colors" 
       title="Compartir en LinkedIn">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
    </a>
    
    <button type="button" 
            onclick="copyPageUrl(this)" 
            data-url="{{ current_url }}"
            class="btn btn-ghost btn-circle btn-sm relative group/copy hover:text-primary transition-colors" 
            title="Copiar enlace">
      <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      
      <span class="copy-tooltip absolute -top-8 left-1/2 -translate-x-1/2 bg-neutral text-neutral-content text-[10px] font-bold px-2 py-0.5 rounded opacity-0 pointer-events-none transition-opacity duration-200 whitespace-nowrap">
        ¡Copiado!
      </span>
    </button>

  </div>
</div>
{% endwith %}

<script>
  if (typeof copyPageUrl !== 'function') {
    function copyPageUrl(button) {
      const url = button.getAttribute('data-url');
      const tooltip = button.querySelector('.copy-tooltip');
      
      navigator.clipboard.writeText(url).then(() => {
        tooltip.classList.remove('opacity-0');
        tooltip.classList.add('opacity-100');
        
        setTimeout(() => {
          tooltip.classList.remove('opacity-100');
          tooltip.classList.add('opacity-0');
        }, 2000);
      });
    }
  }
</script>
