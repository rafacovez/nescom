{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16 w-full grow">
  <article class="flex flex-col gap-6">
    <header class="border-b border-base-200 pb-8 flex flex-col gap-4 text-left w-full">
        
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-black text-base-content tracking-tight leading-tight">
            {{ page.title }}
        </h1>
        
        {% if page.subtitular %}
            <p class="text-lg text-base-content/75 font-medium leading-relaxed">{{ page.subtitular }}</p>
        {% endif %}
        
        <time datetime="{{ page.last_published_at|date:'Y-m-d' }}" class="text-xs text-base-content/50 font-medium">
            Última actualización: {{ page.last_published_at|date:"j \d\e F, Y" }}
        </time>
    </header>

    <div class="prose prose-lg max-w-none text-base-content/90 leading-relaxed pt-4 w-full">
      {{ page.cuerpo|richtext }}
    </div>
  </article>
</div>
{% endblock %}
