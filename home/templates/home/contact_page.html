{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-start">
    
    <div class="lg:col-span-5 flex flex-col gap-6">
      <h1 class="text-4xl sm:text-5xl font-black text-base-content tracking-tight leading-tight">
        {{ page.title }}
      </h1>
      {% if page.subtitular %}
        <p class="text-lg text-base-content/75 leading-relaxed">{{ page.subtitular }}</p>
      {% endif %}
      {% if page.intro %}
        <div class="prose text-base-content/80 mt-2">{{ page.intro|richtext }}</div>
      {% endif %}
    </div>
    
    <div class="lg:col-span-7">
      {% include "components/contact_form.html" with contact_page=page %}
    </div>

  </div>
</div>
{% endblock %}
