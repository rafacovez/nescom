{% for block in value.enlace %}
  {% if block.block_type == 'pagina' %}
    <a href="{{ block.value.url }}" class="btn btn-primary shadow-lg">
      {{ value.texto }}
    </a>
  {% elif block.block_type == 'url_externa' %}
    <a href="{{ block.value }}" target="_blank" rel="noopener noreferrer" class="btn btn-primary shadow-lg">
      {{ value.texto }}
    </a>
  {% endif %}
{% endfor %}
